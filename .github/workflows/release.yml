name: Выпуск релиза

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Обновить список специализаций
        run: python3 tools/generate_toc.py

      - name: Проверить версии проекта
        run: python3 tools/check_version.py

      - name: Прочитать версию аддона
        id: version
        shell: bash
        run: |
          VERSION="$(awk -F': ' '/^## Version:/ { print $2; exit }' TopDps.toc | tr -d '\r')"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Проверить существующий релиз
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Собрать архив аддона
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          rm -rf build
          mkdir -p build/TopDps
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='README.md' \
            --exclude='CONTRIBUTING.md' \
            --exclude='docs' \
            --exclude='tools' \
            --exclude='build' \
            ./ build/TopDps/
          cd build
          zip -r "TopDps-$VERSION.zip" TopDps

      - name: Проверить архив аддона
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          ARCHIVE="build/TopDps-$VERSION.zip"
          unzip -t "$ARCHIVE"

          python3 - "$ARCHIVE" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          archive_path = sys.argv[1]
          forbidden_roots = {".git", ".github", "docs", "tools", "build"}
          forbidden_files = {"README.md", "CONTRIBUTING.md"}

          with zipfile.ZipFile(archive_path) as archive:
              names = set(archive.namelist())

              if "TopDps/TopDps.toc" not in names:
                  raise SystemExit("В архиве отсутствует TopDps/TopDps.toc")

              for name in names:
                  if not name.startswith("TopDps/"):
                      raise SystemExit("Файл вне корня TopDps/: " + name)

                  relative = name[len("TopDps/"):]
                  if not relative or name.endswith("/"):
                      continue

                  parts = PurePosixPath(relative).parts
                  if parts[0] in forbidden_roots or relative in forbidden_files:
                      raise SystemExit("В релизный архив попал служебный файл: " + name)

              toc = archive.read("TopDps/TopDps.toc").decode("utf-8")
              missing = []
              for raw_line in toc.splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue

                  expected = "TopDps/" + line.replace("\\", "/")
                  if expected not in names:
                      missing.append(expected)

              if missing:
                  raise SystemExit("В архиве отсутствуют файлы из TOC: " + ", ".join(missing))

          print("Архив релиза проверен")
          PY

      - name: Подготовить описание релиза
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [ "$VERSION" = "0.1.1" ]; then
            cat > release-notes.md <<'EOF'
          Первый публичный релиз TopDps после переименования проекта.

          - Аддон переименован из RpalTopDps в TopDps.
          - Добавлена миграция старых SavedVariables из RpalTopDpsDB в TopDpsDB.
          - Версионирование проекта переведено на ветку 0.1.x.
          - Добавлены команды /topdps и /td.
          - Автор изменён на Johnyyyk.
          - README переведён в Markdown, документация для разработчиков вынесена отдельно.
          - На данный момент поддерживается Retribution Paladin для WoW 3.3.5a.
          EOF
          elif [ "$VERSION" = "1.0.0" ]; then
            cat > release-notes.md <<'EOF'
          Крупный архитектурный рефактор TopDps с подготовкой проекта к расширению новыми классами и специализациями.

          - Общий движок разделён на отдельные слои работы с панелями, готовностью способностей, контекстом боя и выбором рекомендации.
          - Добавлены базовый SpecProvider, SpecRegistry и кешируемый SpecManager.
          - Специализации теперь подключаются по classToken и дереву талантов без class-specific логики в общем движке.
          - Retribution Paladin переведён на декларативное описание способностей без изменения текущих приоритетов и условий ротации.
          - Добавлена автоматическая генерация списка файлов специализаций в TopDps.toc.
          - Добавлены CI-проверки актуальности TOC, Lua 5.1 и XML.
          - Удалены runtime-остатки старого имени RpalTopDps; старый SavedVariables оставлен только для миграции настроек.
          - Архитектура ReadinessService подготовлена для будущего lookahead по GCD/cooldown, но сама функция lookahead в этот релиз не входит.
          EOF
          elif [ "$VERSION" = "1.1.0" ]; then
            cat > release-notes.md <<'EOF'
          Расширение настроек ротации и более надёжное определение специализации.

          - Добавлено автоматическое определение класса и ветки талантов; неподдерживаемые специализации больше не получают чужую ротацию.
          - Исправлено определение специализации после загрузочных экранов и входа в подземелья без необходимости `/reload`.
          - Добавлена настройка опережения подсветки способности по откату от 0 до 0.5 секунды.
          - Добавлена отдельная страница «Ротация» с настройками для каждой поддерживаемой специализации.
          - Можно полностью отключить ротацию конкретной специализации или отдельные категории способностей.
          - Настройки специализаций вынесены в отдельное хранилище с автоматической миграцией существующих настроек.
          - Архитектура настроек подготовлена для подключения новых классов и специализаций без изменений общего Core/UI.
          EOF
          elif [ "$VERSION" = "2.0.0" ]; then
            cat > release-notes.md <<'EOF'
          TopDps 2.0.0 разделяет ротацию и боевую панель на независимые функции и завершает крупный рефактор архитектуры настроек.

          - Добавлена отдельная боевая панель для обязательных бафов, проков, защиты/утилити, тринь и дополнительных кулдаунов.
          - Для проков добавлены таймеры и звуковые уведомления с общим и индивидуальными переключателями.
          - Ротация и панель теперь независимо включаются для каждого персонажа и используют общий режим работы аддона.
          - Настройки ротации и панели разделены по отдельным страницам и областям SavedVariables.
          - Добавлена настройка cooldown lookahead до 0.5 секунды для ранней подсветки следующей способности.
          - Исправлена обработка equipment proc и логика показа разблокированной панели при выключенном режиме.
          - Удалены compatibility proxy, миграции старой БД и цепочки override/monkey-patch, из-за которых поведение зависело от порядка файлов в TOC.
          - Добавлена CI-защита от возврата legacy flat-ключей и удалённой архитектуры настроек.
          - SavedVariables версий 1.x не мигрируются: после обновления настройки необходимо проверить заново.
          EOF
          elif [ "$VERSION" = "2.1.0" ]; then
            cat > release-notes.md <<'EOF'
          TopDps 2.1.0 существенно расширяет поддержку классов и возможностей ротации, сохраняя общую архитектуру версии 2.x.

          - Добавлены DPS-ротации и боевые панели для всех DPS-специализаций WotLK 3.3.5a; для healer/tank специализаций добавлены panel-only профили.
          - Ядро расширено универсальными состояниями юнитов, cast/channel, swing, temporary weapon enchants, refresh-логикой и другими общими primitives без class-specific зависимостей.
          - Выбор основной рекомендации отвязан от видимых кнопок action bar: изученная способность может рекомендоваться и отображаться центральной иконкой даже без кнопки на панели.
          - Добавлен отдельный next-swing канал рекомендаций для модификаторов следующей автоатаки с независимой подсветкой; для Warrior перенесены Heroic Strike/Cleave.
          - Добавлены movement-aware приоритеты, упреждающее обновление эффектов с учётом времени каста и расширен cooldown lookahead до 0.75 секунды.
          - Добавлен безопасный механизм экспериментальных функций с двойным opt-in и экспериментальная оценка time-to-die для выбора проклятий Warlock.
          - Видимость боевой панели теперь настраивается отдельно для открытого мира и PvE-инстансов; улучшена работа звуков проков при скрытой панели.
          - Эквивалентные рейдовые бафы и дебафы учитываются централизованно; исправлены обязательные и опциональные бафы нескольких классов.
          - SavedVariables schema повышена до 5: при обновлении с 2.0.0 `TopDpsDB` будет создан заново, а отдельные per-character переключатели в `TopDpsCharDB` сохранятся.
          - Существенно расширены regression/smoke проверки классов, ротации, панели, next-swing и общих сервисов.
          EOF
          else
            printf 'Изменения версии v%s.\n' "$VERSION" > release-notes.md
          fi

      - name: Создать GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "v$VERSION" \
            "build/TopDps-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes-file release-notes.md
