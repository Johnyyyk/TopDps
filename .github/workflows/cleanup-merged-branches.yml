name: Очистка слитых веток

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Удалить слитые ветки
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const protectedBranches = new Set(['main', 'develop']);

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'closed',
              per_page: 100,
            });

            const mergedBranches = new Set(
              pulls
                .filter(pr =>
                  pr.merged_at &&
                  pr.head.repo &&
                  pr.head.repo.full_name === `${owner}/${repo}` &&
                  !protectedBranches.has(pr.head.ref)
                )
                .map(pr => pr.head.ref)
            );

            for (const branch of mergedBranches) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted merged branch: ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Branch already absent or cannot be deleted: ${branch}`);
                  continue;
                }

                throw error;
              }
            }
